# CircleCI pipeline for cicd-training-2026
# See: https://circleci.com/docs/reference/configuration-reference/
version: 2.1

jobs:
  # 1. Compile, run the unit tests and package the jar
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0   # Java 21 + Maven
    steps:
      - checkout

      # Reuse downloaded Maven dependencies between runs
      - restore_cache:
          keys:
            - maven-deps-v1-{{ checksum "pom.xml" }}
            - maven-deps-v1-

      - run:
          name: Download dependencies
          command: mvn -B dependency:go-offline

      - save_cache:
          key: maven-deps-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2/repository

      - run:
          name: Run tests
          command: mvn -B test

      # Show test results in the CircleCI "Tests" tab
      - store_test_results:
          path: target/surefire-reports

      - run:
          name: Package jar
          command: mvn -B package -DskipTests

      # Downloadable from the CircleCI "Artifacts" tab
      - store_artifacts:
          path: target/app.jar
          destination: app.jar

  # 2. Build the Docker image and smoke test it
  docker-build:
    machine:
      image: ubuntu-2204:current   # VM with Docker installed
    steps:
      - checkout

      - run:
          name: Build Docker image
          command: |
            docker build -t cicd-training-2026:${CIRCLE_SHA1:0:7} .

      - run:
          name: Start container
          command: |
            docker run -d --name app -p 8080:8080 \
              -e APP_VERSION=${CIRCLE_SHA1:0:7} \
              cicd-training-2026:${CIRCLE_SHA1:0:7}

      - run:
          name: Smoke test /health
          command: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/health; then
                echo
                echo "App is up"
                exit 0
              fi
              sleep 2
            done
            echo "App did not become healthy in time"
            docker logs app
            exit 1

      - run:
          name: Container logs
          command: docker logs app
          when: always

workflows:
  build-test-docker:
    jobs:
      - build-and-test
      - docker-build:
          requires:
            - build-and-test
