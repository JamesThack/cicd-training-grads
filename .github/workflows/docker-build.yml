name: 2 - Docker build

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t cicd-training-2026:${{ github.sha }} .

      - name: List the image
        run: docker image ls cicd-training-2026
