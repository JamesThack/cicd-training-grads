name: 3 - Unit tests and Docker build

on:
  # Run on every pull request into main (and on each new push to that PR)
  pull_request:
    branches: [main]
  # Still runnable manually from the Actions tab ("Run workflow" button)
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuse downloaded dependencies between runs

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test reports
        if: always()     # keep the reports even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      # Only reached if the tests passed
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: cicd-training-2026:${{ github.sha }}
          load: true
          cache-from: type=gha, scope=backend
          cache-to: type=gha,mode=max, scope=backend
