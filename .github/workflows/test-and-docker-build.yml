name: 3 - Unit tests and Docker build

on:
  # Run on every pull request into main (and on each new push to that PR)
  pull_request:
    branches: [main]
  # Still runnable manually from the Actions tab ("Run workflow" button)
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (${{ matrix.test-class }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-class:
          - HelloControllerTest
          - CicdTrainingApplicationTests

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuse downloaded dependencies between runs

      - name: Run unit tests
        run: mvn -B -Dtest="${{ matrix.test-class }}" test

      - name: Upload test reports
        if: always()     # keep the reports even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.test-class }}
          path: target/surefire-reports

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Build the Docker image
        run: docker build -t cicd-training-2026:${{ github.sha }} .
