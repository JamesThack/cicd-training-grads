name: 3 - Unit tests and Docker build

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuse downloaded dependencies between runs

      - name: Run unit tests
        run: mvn -B test

      - name: Upload test reports
        if: always()     # keep the reports even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      # Only reached if the tests passed
      - name: Build the Docker image
        run: docker build -t cicd-training-2026:${{ github.sha }} .
